aid: gomultiply
name: Gomultiply
description: >-
  Multiply (gomultiply.com) is an AI-native paid media agency for B2B companies
  that combines proprietary self-learning advertising AI with human growth
  strategists. The platform plugs into a customer's sales calls and CRM data to
  learn why buyers actually convert, then uses 25+ specialized AI agents
  (customer insights, keyword, creative design, A/B testing, bidding, and
  attribution) to generate, launch, and continuously optimize hundreds of
  personalized ad experiments across Google and LinkedIn. Founded by Matt Jayson
  (formerly Google and Brex) and Ashish Warty (formerly SVP Engineering at
  HackerOne, Dropbox, and Airship), Multiply emerged from stealth with $9.5M led
  by Mayfield and reports 300-500% increases in sales meetings booked and
  pipeline generated for its B2B customers.
